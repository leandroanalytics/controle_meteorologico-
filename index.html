<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b3b66" />
  <title>Registro de Localização · Controle Meteorológico</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230ea5e9' d='M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef3f9;
      --bg-grid: rgba(11, 59, 102, 0.06);
      --surface: #ffffff;
      --surface-2: #f5f8fc;
      --text: #0f1e33;
      --text-muted: #5b6b80;
      --border: #d8e1ec;
      --primary: #0b5cad;
      --primary-hover: #094a8c;
      --accent: #0ea5e9;
      --ring: rgba(14, 165, 233, 0.28);
      --sky-1: #0b3b66;
      --sky-2: #0f6aa8;
      --sky-3: #22b0d8;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --success-border: #a7f3d0;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --error-border: #fecaca;
      --danger: #dc2626;
      --radius: 18px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(15, 30, 51, 0.04), 0 18px 40px -16px rgba(11, 59, 102, 0.25);
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #07111f;
        --bg-grid: rgba(148, 197, 255, 0.05);
        --surface: #0f1b2d;
        --surface-2: #14233a;
        --text: #e8f0fa;
        --text-muted: #8fa3bd;
        --border: #233650;
        --primary: #2f8ae0;
        --primary-hover: #4a9be6;
        --accent: #38bdf8;
        --ring: rgba(56, 189, 248, 0.3);
        --success-bg: #052e22;
        --success-text: #a7f3d0;
        --success-border: #0f6b4f;
        --error-bg: #3b0d0d;
        --error-text: #fecaca;
        --error-border: #8a1c1c;
        --danger: #f87171;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 24px 48px -20px rgba(0, 0, 0, 0.7);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: rise 0.45s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    /* Cabeçalho com faixa de "céu" */
    header {
      position: relative;
      padding: 26px 26px 24px;
      color: #ffffff;
      background:
        radial-gradient(120% 140% at 100% 0%, rgba(255, 255, 255, 0.18) 0%, transparent 45%),
        linear-gradient(135deg, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
      overflow: hidden;
    }

    header::after {
      /* linhas de contorno sutis, lembrando um mapa topográfico */
      content: "";
      position: absolute;
      right: -60px;
      bottom: -90px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, transparent 0 14px, rgba(255, 255, 255, 0.09) 14px 15px);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .eyebrow .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6ee7b7;
      box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.25);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    header p {
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.82);
      margin-top: 6px;
      max-width: 34ch;
      position: relative;
      z-index: 1;
    }

    .body {
      padding: 22px 26px 26px;
    }

    .step-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .step-label b {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 0.7rem;
    }

    .gps-bar { margin-bottom: 22px; }

    .btn {
      width: 100%;
      min-height: 50px;
      padding: 12px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.06s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .btn svg { flex-shrink: 0; }
    .btn:active:not(:disabled) { transform: scale(0.985); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn:focus-visible,
    .clear-btn:focus-visible,
    .map-preview a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }

    .btn-secondary {
      background-color: var(--surface-2);
      color: var(--primary);
      border: 1.5px dashed color-mix(in srgb, var(--primary) 45%, var(--border));
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: color-mix(in srgb, var(--accent) 10%, var(--surface-2));
      border-style: solid;
      border-color: var(--accent);
    }

    .btn-primary {
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 88%, #fff) 0%, var(--primary) 100%);
      color: #ffffff;
      margin-top: 6px;
      box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--primary) 70%, transparent);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-primary .arrow { transition: transform 0.15s ease; }
    .btn-primary:hover:not(:disabled) .arrow { transform: translateX(3px); }

    .form-group { margin-bottom: 16px; }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 420px) {
      .coords-grid { grid-template-columns: 1fr; }
      header, .body { padding-left: 20px; padding-right: 20px; }
    }

    label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .field {
      position: relative;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--surface-2);
      color: var(--text);
      font-family: inherit;
      font-size: 0.97rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    input::placeholder { color: color-mix(in srgb, var(--text-muted) 70%, transparent); }

    input:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }

    input:focus {
      outline: none;
      background-color: var(--surface);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .coord input {
      font-family: var(--mono);
      font-size: 0.92rem;
      padding-right: 34px;
      letter-spacing: -0.01em;
    }

    .coord .unit {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    input.invalid {
      border-color: var(--danger);
      background-color: color-mix(in srgb, var(--danger) 6%, var(--surface));
    }

    input.invalid:focus {
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 22%, transparent);
    }

    /* Prévia do mapa */
    .map-preview {
      display: none;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .map-preview.visible {
      display: block;
      animation: rise 0.3s ease-out both;
    }

    .map-preview iframe {
      display: block;
      width: 100%;
      height: 170px;
      border: 0;
      filter: saturate(0.9);
    }

    @media (prefers-color-scheme: dark) {
      .map-preview iframe { filter: invert(0.9) hue-rotate(180deg) saturate(0.6) brightness(0.95); }
    }

    .map-preview a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      border-top: 1px solid var(--border);
    }

    .map-preview a:hover { background: color-mix(in srgb, var(--accent) 8%, var(--surface-2)); }

    /* Alertas */
    .alert {
      display: none;
      padding: 12px 14px 12px 40px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 18px;
      border: 1px solid transparent;
      position: relative;
    }

    .alert.visible {
      display: block;
      animation: rise 0.25s ease-out both;
    }

    .alert::before {
      position: absolute;
      left: 14px;
      top: 11px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: #fff;
    }

    .alert.success {
      background-color: var(--success-bg);
      color: var(--success-text);
      border-color: var(--success-border);
    }

    .alert.success::before { content: "✓"; background: #10b981; }

    .alert.error {
      background-color: var(--error-bg);
      color: var(--error-text);
      border-color: var(--error-border);
    }

    .alert.error::before { content: "!"; background: #ef4444; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Histórico */
    .history {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      display: none;
    }

    .history.visible { display: block; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-header h2 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .clear-btn:hover { color: var(--danger); border-color: var(--danger); }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .history-item .pin {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--primary);
    }

    .history-item .info { min-width: 0; }

    .history-item .info strong {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item .info small {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .history-item time {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .site-footer {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }

    .site-footer a {
      color: inherit;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid var(--border);
    }

    .site-footer a:hover { color: var(--primary); border-color: var(--primary); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <span class="eyebrow"><span class="dot"></span>Controle Meteorológico</span>
      <h1>Check-in de Localização</h1>
      <p>Capture suas coordenadas via GPS ou preencha manualmente para registrar.</p>
    </header>

    <div class="body">
      <div id="statusAlert" class="alert" role="status" aria-live="polite"></div>

      <div class="gps-bar">
        <div class="step-label"><b>1</b>Capturar posição</div>
        <button type="button" id="btnGps" class="btn btn-secondary">
          <span id="gpsIcon"></span>
          <span id="gpsText">Usar minha localização atual</span>
        </button>
      </div>

      <form id="locationForm" novalidate>
        <div class="step-label"><b>2</b>Conferir dados</div>

        <div class="form-group">
          <label for="localInput">Nome do Local</label>
          <input
            type="text"
            id="localInput"
            name="entry.1227901560"
            placeholder="Ex.: Matriz, Cliente X, Ponto de Coleta"
            required
            autocomplete="off"
          />
        </div>

        <div class="coords-grid">
          <div class="form-group">
            <label for="latInput">Latitude</label>
            <div class="field coord">
              <input
                type="text"
                id="latInput"
                name="entry.1811456845"
                placeholder="-19.916681"
                inputmode="decimal"
                required
              />
              <span class="unit" aria-hidden="true">°</span>
            </div>
          </div>

          <div class="form-group">
            <label for="lngInput">Longitude</label>
            <div class="field coord">
              <input
                type="text"
                id="lngInput"
                name="entry.147098017"
                placeholder="-43.934493"
                inputmode="decimal"
                required
              />
              <span class="unit" aria-hidden="true">°</span>
            </div>
          </div>
        </div>

        <div id="mapPreview" class="map-preview">
          <iframe id="mapFrame" title="Prévia do ponto no mapa" loading="lazy" referrerpolicy="no-referrer"></iframe>
          <a id="mapLink" href="#" target="_blank" rel="noopener noreferrer">
            <span>Conferir ponto no Google Maps</span>
            <span aria-hidden="true">↗</span>
          </a>
        </div>

        <div class="step-label"><b>3</b>Registrar</div>
        <button type="submit" id="btnSubmit" class="btn btn-primary"></button>
      </form>

      <section id="historySection" class="history" aria-label="Registros recentes">
        <div class="history-header">
          <h2>Últimos envios (este dispositivo)</h2>
          <button type="button" id="btnClearHistory" class="clear-btn">Limpar</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    Desenvolvido por <a href="https://github.com/leandroanalytics" target="_blank" rel="noopener noreferrer">Leandro Gomes</a> · Analista de Dados
  </footer>

  <script>
    (() => {
      // Configuração do Google Forms
      const FORM_ACTION_URL =
        "https://docs.google.com/forms/d/e/1FAIpQLScYslMO6l4a4FWJy_bCBiUpNTW2hFi5Tqn1Rkrcu6c7rOfQyw/formResponse";

      const FIELDS = {
        local: "entry.1227901560",
        latitude: "entry.1811456845",
        longitude: "entry.147098017",
      };

      const STORAGE_KEY = "geo_checkin_history_v1";

      // Ícones (SVG inline)
      const ICON_TARGET =
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
      const ICON_ARROW =
        '<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
      const ICON_PIN =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
      const SUBMIT_LABEL = `<span>Enviar Registro</span>${ICON_ARROW}`;

      // Elementos do DOM
      const form = document.getElementById("locationForm");
      const localInput = document.getElementById("localInput");
      const latInput = document.getElementById("latInput");
      const lngInput = document.getElementById("lngInput");
      const btnGps = document.getElementById("btnGps");
      const gpsIcon = document.getElementById("gpsIcon");
      const gpsText = document.getElementById("gpsText");
      const btnSubmit = document.getElementById("btnSubmit");
      const statusAlert = document.getElementById("statusAlert");
      const mapPreview = document.getElementById("mapPreview");
      const mapLink = document.getElementById("mapLink");
      const mapFrame = document.getElementById("mapFrame");
      const historySection = document.getElementById("historySection");
      const historyList = document.getElementById("historyList");
      const btnClearHistory = document.getElementById("btnClearHistory");

      gpsIcon.innerHTML = ICON_TARGET;
      btnSubmit.innerHTML = SUBMIT_LABEL;

      function showAlert(message, type) {
        statusAlert.textContent = message;
        statusAlert.className = `alert visible ${type}`;
      }

      function hideAlert() {
        statusAlert.className = "alert";
      }

      function normalizeCoord(value) {
        return value.trim().replace(",", ".");
      }

      function isValidLatitude(val) {
        if (val === "") return false;
        const num = Number(val);
        return Number.isFinite(num) && num >= -90 && num <= 90;
      }

      function isValidLongitude(val) {
        if (val === "") return false;
        const num = Number(val);
        return Number.isFinite(num) && num >= -180 && num <= 180;
      }

      // Atualiza o link e a miniatura do mapa (com pequeno atraso para não recarregar a cada tecla)
      let mapTimer;
      function updateMapPreview() {
        const lat = normalizeCoord(latInput.value);
        const lng = normalizeCoord(lngInput.value);

        clearTimeout(mapTimer);

        if (isValidLatitude(lat) && isValidLongitude(lng)) {
          mapLink.href = `https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lng)}`;
          mapPreview.classList.add("visible");

          mapTimer = setTimeout(() => {
            const la = Number(lat);
            const lo = Number(lng);
            const d = 0.004;
            const bbox = [lo - d, la - d * 0.6, lo + d, la + d * 0.6].map((n) => n.toFixed(6)).join(",");
            const src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${la},${lo}`;
            if (mapFrame.getAttribute("src") !== src) mapFrame.setAttribute("src", src);
          }, 400);
        } else {
          mapPreview.classList.remove("visible");
        }
      }

      // Geocodificação reversa opcional para sugerir o nome do local caso o campo esteja vazio
      async function suggestPlaceName(lat, lng) {
        if (localInput.value.trim() !== "") return;
        try {
          const response = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`,
            { headers: { Accept: "application/json" } }
          );
          if (!response.ok) return;
          const data = await response.json();
          if (data && data.display_name && localInput.value.trim() === "") {
            const parts = data.display_name.split(",").slice(0, 3).map((p) => p.trim());
            localInput.value = parts.join(", ");
          }
        } catch {
          // Falha silenciosa: usuário pode preencher manualmente
        }
      }

      function setGpsLoading(loading) {
        btnGps.disabled = loading;
        if (loading) {
          gpsIcon.innerHTML = '<span class="spinner"></span>';
          gpsText.textContent = "Obtendo coordenadas...";
        } else {
          gpsIcon.innerHTML = ICON_TARGET;
          gpsText.textContent = "Usar minha localização atual";
        }
      }

      btnGps.addEventListener("click", () => {
        hideAlert();

        if (!("geolocation" in navigator)) {
          showAlert("Seu navegador não suporta geolocalização.", "error");
          return;
        }

        setGpsLoading(true);

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);

            latInput.value = lat;
            lngInput.value = lng;
            latInput.classList.remove("invalid");
            lngInput.classList.remove("invalid");
            updateMapPreview();

            await suggestPlaceName(lat, lng);
            setGpsLoading(false);
            showAlert("Coordenadas capturadas com sucesso.", "success");
          },
          (error) => {
            setGpsLoading(false);
            const messages = {
              1: "Permissão de localização negada. Libere o acesso nas configurações do navegador.",
              2: "Não foi possível determinar sua localização no momento.",
              3: "Tempo esgotado ao tentar obter o sinal de GPS.",
            };
            showAlert(messages[error.code] || "Erro ao capturar localização.", "error");
          },
          {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 0,
          }
        );
      });

      latInput.addEventListener("input", () => {
        latInput.classList.remove("invalid");
        updateMapPreview();
      });

      lngInput.addEventListener("input", () => {
        lngInput.classList.remove("invalid");
        updateMapPreview();
      });

      localInput.addEventListener("input", () => {
        localInput.classList.remove("invalid");
      });

      // Histórico local
      function readHistory() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        } catch {
          return [];
        }
      }

      function renderHistory() {
        const items = readHistory();
        if (!items.length) {
          historySection.classList.remove("visible");
          return;
        }

        historyList.innerHTML = items
          .map(
            (item) => `
            <li class="history-item">
              <span class="pin">${ICON_PIN}</span>
              <span class="info">
                <strong>${escapeHtml(item.local)}</strong>
                <small>${escapeHtml(item.lat)}, ${escapeHtml(item.lng)}</small>
              </span>
              <time>${escapeHtml(item.time)}</time>
            </li>`
          )
          .join("");

        historySection.classList.add("visible");
      }

      function saveToHistory(local, lat, lng) {
        const items = readHistory();
        const now = new Date().toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
        });
        items.unshift({ local, lat, lng, time: now });
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items.slice(0, 5)));
        } catch {
          // Armazenamento indisponível (ex.: modo privado): segue sem histórico
        }
        renderHistory();
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      btnClearHistory.addEventListener("click", () => {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch {}
        renderHistory();
      });

      // Submissão para o Google Forms
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        hideAlert();

        const local = localInput.value.trim();
        const lat = normalizeCoord(latInput.value);
        const lng = normalizeCoord(lngInput.value);

        let hasError = false;

        if (!local) {
          localInput.classList.add("invalid");
          hasError = true;
        }

        if (!isValidLatitude(lat)) {
          latInput.classList.add("invalid");
          hasError = true;
        }

        if (!isValidLongitude(lng)) {
          lngInput.classList.add("invalid");
          hasError = true;
        }

        if (hasError) {
          showAlert("Verifique os campos destacados. Latitude deve estar entre -90 e 90, e Longitude entre -180 e 180.", "error");
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner"></span> Enviando...';

        const payload = new URLSearchParams();
        payload.append(FIELDS.local, local);
        payload.append(FIELDS.latitude, lat);
        payload.append(FIELDS.longitude, lng);

        try {
          // mode: 'no-cors' é obrigatório para envio direto ao Google Forms sem bloqueio de CORS
          await fetch(FORM_ACTION_URL, {
            method: "POST",
            mode: "no-cors",
            body: payload,
          });

          saveToHistory(local, lat, lng);
          form.reset();
          updateMapPreview();
          showAlert("Registro enviado com sucesso para a planilha!", "success");
        } catch {
          showAlert("Falha de conexão ao enviar os dados. Verifique sua internet.", "error");
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = SUBMIT_LABEL;
        }
      });

      renderHistory();
    })();
  </script>
</body>
</html>
